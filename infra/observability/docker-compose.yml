version: "3.9"

services:
  # ─── OpenTelemetry Collector ────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: fdc3-otel-collector
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  (Node.js BE)
      - "4318:4318"   # OTLP HTTP  (Angular FE / browser)
      - "8889:8889"   # Prometheus scrape endpoint (collector self-metrics)
    networks:
      - obs
    depends_on:
      - tempo

  # ─── Grafana Tempo (trace backend) ──────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    container_name: fdc3-tempo
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana datasource)
    networks:
      - obs

  # ─── Prometheus (metrics backend) ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fdc3-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - obs

  # ─── Grafana (visualisation) ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: fdc3-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - obs
    depends_on:
      - tempo
      - prometheus

networks:
  obs:
    driver: bridge

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
