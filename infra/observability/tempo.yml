server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

# ─── Metrics Generator ──────────────────────────────────────────────────────
# Generates Prometheus RED metrics from trace data.
# span-metrics  → calls_total + duration histogram per span name
# service-graphs → request rate + error rate between services
# local-blocks  → enables TraceQL metrics queries from Grafana
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: fdc3-poc
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /tmp/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true
    service_graphs:
      dimensions:
        - service.name
        - http.method
        - http.status_code
      peer_attributes:
        - db.name
        - messaging.system
    span_metrics:
      dimensions:
        - service.name
        - http.method
        - http.status_code
        - http.target
      enable_target_info: true

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095

# Enable metrics generator for the default (anonymous) tenant
overrides:
  defaults:
    metrics_generator:
      processors:
        - local-blocks
        - service-graphs
        - span-metrics
      generate_native_histograms: both
