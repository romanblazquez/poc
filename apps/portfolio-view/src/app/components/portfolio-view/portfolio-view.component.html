<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">PV</span>
      <span class="ws-title-text">Portfolio View</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0">
      <ng-container *ngIf="positions.length > 0">
        <span style="min-width:0;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ws-muted);font-size:12px;font-weight:800">
          {{ customerName }}
        </span>
        <span style="color:var(--ws-muted);font-size:12px;font-weight:800">USD {{ totalValue | number:'1.0-0' }}</span>
        <span style="font-size:12px;font-weight:850" [class.positive]="totalPnL >= 0" [class.negative]="totalPnL < 0">
          {{ totalPnL >= 0 ? '+' : '' }}{{ totalPnL | number:'1.0-0' }}
        </span>
      </ng-container>
      <p-tag [value]="positions.length + ' positions'" severity="info"></p-tag>
    </div>
  </div>

  <div *ngIf="positions.length === 0" class="ws-empty">
    <div class="ws-empty-icon">PV</div>
    <div style="font-weight:800">No portfolio loaded</div>
    <div style="font-size:13px;max-width:280px;line-height:1.5">
      Join a channel, then select a customer in Customer Search to load their portfolio.
    </div>
  </div>

  <ng-container *ngIf="positions.length > 0">
    <div [class]="agGridTheme" class="ws-grid">
      <ag-grid-angular
        [rowData]="positions"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [getRowId]="getRowId"
        rowSelection="single"
        [animateRows]="true"
        (rowClicked)="onGridRowClicked($event)"
        style="width:100%;height:100%"
      ></ag-grid-angular>
    </div>
  </ng-container>
</div>
