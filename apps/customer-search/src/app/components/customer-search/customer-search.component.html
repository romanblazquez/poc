<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">CS</span>
      <span class="ws-title-text">Customer Search</span>
    </div>
    <p-tag [value]="filtered.length + ' matches'" severity="info"></p-tag>
  </div>

  <div class="ws-toolbar">
    <input
      pInputText
      type="text"
      placeholder="Search by name, ID, or segment"
      [(ngModel)]="query"
      style="width:100%;max-width:420px"
    />
    <p-tag *ngIf="lastBroadcast" [value]="'Broadcast sent: ' + lastBroadcast" severity="success"></p-tag>
  </div>

  <div [class]="agGridTheme" class="ws-grid">
    <ag-grid-angular
      [rowData]="filtered"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [getRowId]="getRowId"
      rowSelection="single"
      [animateRows]="true"
      (rowClicked)="onGridRowClicked($event)"
      style="width:100%;height:100%"
    ></ag-grid-angular>
  </div>
</div>
