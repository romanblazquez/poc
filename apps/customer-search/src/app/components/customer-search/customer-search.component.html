<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">CS</span>
      <span class="ws-title-text">Customer Search</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0">
      <input
        pInputText
        type="text"
        placeholder="Search by name, ID, or segment"
        [(ngModel)]="query"
        style="width:min(34vw,320px);min-width:180px"
      />
      <p-tag *ngIf="lastBroadcast" [value]="'Sent: ' + lastBroadcast" severity="success"></p-tag>
      <p-tag [value]="filtered.length + ' matches'" severity="info"></p-tag>
    </div>
  </div>

  <div [class]="agGridTheme" class="ws-grid">
    <ag-grid-angular
      [rowData]="filtered"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [getRowId]="getRowId"
      rowSelection="single"
      [animateRows]="true"
      (rowClicked)="onGridRowClicked($event)"
      style="width:100%;height:100%"
    ></ag-grid-angular>
  </div>
</div>
