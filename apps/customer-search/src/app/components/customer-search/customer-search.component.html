<div class="workstation-app">
  <interop-workstation-header mark="CS" title="Customer Search">
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0">
      <input
        pInputText
        type="text"
        placeholder="Search by name, ID, or segment"
        [(ngModel)]="query"
        style="width:min(34vw,320px);min-width:180px"
      />
      <interop-status-badge *ngIf="lastBroadcast" [label]="lastBroadcast" severity="success" />
      <interop-status-badge [label]="filtered.length + ' matches'" severity="info" />
      <interop-channel-picker />
    </div>
  </interop-workstation-header>

  <div [class]="agGridTheme" class="ws-grid">
    <ag-grid-angular
      [rowData]="filtered"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [getRowId]="getRowId"
      rowSelection="single"
      [animateRows]="true"
      (gridReady)="onGridReady($event)"
      (rowClicked)="onGridRowClicked($event)"
      style="width:100%;height:100%"
    ></ag-grid-angular>
  </div>
</div>
