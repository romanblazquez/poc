<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">TH</span>
      <span class="ws-title-text">Theme</span>
    </div>
    <p-tag [value]="themes[theme].label" severity="info"></p-tag>
  </div>

  <div class="ws-content" style="display:flex;align-items:center;justify-content:center">
    <div class="ws-card" style="width:100%;max-width:360px">
      <div class="ws-label" style="margin-bottom:8px">Workspace Theme</div>
      <p-select
        [ngModel]="theme"
        (ngModelChange)="onThemeChange($event)"
        [options]="themeKeys"
        [style]="{ width: '100%' }"
      >
        <ng-template let-key pTemplate="item">{{ themes[key].label }}</ng-template>
        <ng-template let-key pTemplate="selectedItem">{{ themes[key].label }}</ng-template>
      </p-select>
      <div style="margin-top:10px;color:var(--ws-muted);font-size:12px;font-weight:800">{{ status }}</div>
    </div>
  </div>
</div>
