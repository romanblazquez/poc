<div class="workstation-app" style="background:#101720;color:#eef4fb">

  <!-- Header -->
  <div style="display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;background:#0a0f18;border-bottom:1px solid #1e2d3e;flex-shrink:0">
    <span style="font-size:20px">&#11200;</span>
    <span style="font-weight:700;font-size:15px;color:#eef4fb">Theme</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px;gap:10px">

    <div style="background:#192231;border:1px solid #34465c;border-radius:6px;padding:12px">
      <div style="color:#a9b6c6;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">
        Workspace Theme
      </div>

      <select
        [ngModel]="theme"
        (ngModelChange)="onThemeChange($event)"
        style="width:100%;padding:8px 10px;font-size:13px;font-weight:600;border:1px solid #34465c;border-radius:6px;background:#0d1826;color:#eef4fb;cursor:pointer;outline:none">
        <option *ngFor="let key of themeKeys" [value]="key">{{ themes[key].label }}</option>
      </select>
    </div>

    <div style="color:#a9b6c6;font-size:12px;font-weight:700">{{ status }}</div>

    <div style="background:#192231;border:1px solid #34465c;border-radius:6px;padding:12px;font-size:11px;color:#a9b6c6;line-height:1.6">
      Select a theme above to broadcast <code style="background:#0d1826;padding:1px 4px;border-radius:3px;color:#60a5fa">com.demo.theme</code> context to all connected apps.
    </div>
  </div>
</div>
