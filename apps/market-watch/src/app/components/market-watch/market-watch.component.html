<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">MW</span>
      <span class="ws-title-text">Market Watch</span>
      <p-tag value="Live Sim" severity="success"></p-tag>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <p-tag *ngIf="intentStatus" [value]="intentStatus" severity="info"></p-tag>
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        (click)="channelOpen = !channelOpen"
        [label]="currentChannel?.displayMetadata?.name ?? 'No Channel'"
      ></button>
    </div>
  </div>

  <div *ngIf="channelOpen" class="ws-toolbar" style="gap:8px;min-height:auto">
    <button
      *ngFor="let ch of channels; trackBy: trackByChannelId"
      pButton
      type="button"
      size="small"
      [label]="ch.displayMetadata.name"
      [severity]="currentChannel?.id === ch.id ? 'info' : 'secondary'"
      [outlined]="currentChannel?.id !== ch.id"
      (click)="joinChannel(ch)"
    ></button>
    <button *ngIf="currentChannel" pButton type="button" size="small" label="Leave" severity="secondary" [text]="true" (click)="leaveChannel()"></button>
  </div>

  <div [class]="agGridTheme" class="ws-grid">
    <ag-grid-angular
      [rowData]="quotes"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [getRowId]="getRowId"
      rowSelection="single"
      [animateRows]="true"
      (rowClicked)="onGridRowClicked($event)"
      style="width:100%;height:100%"
    ></ag-grid-angular>
  </div>

  <div class="ws-statusbar" style="height:26px;padding:0 12px;font-size:11px;color:var(--ws-subtle);background:var(--ws-panel)">
    Prices simulated. Tick every 2s. Click a row to broadcast fdc3.instrument context.
  </div>
</div>
