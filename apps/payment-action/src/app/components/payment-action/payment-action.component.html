<div class="workstation-app">
  <interop-workstation-header mark="PA" title="Payment Action">
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0">
      <interop-status-badge *ngIf="status === 'approved'" [label]="'Approved ' + form.reference" severity="success" />
      <interop-status-badge *ngIf="status === 'rejected'" label="Rejected" severity="danger" />
      <interop-status-badge *ngIf="fromIntent" label="Via intent" severity="success" />
      <interop-channel-picker />
    </div>
  </interop-workstation-header>

  <interop-empty-state
    *ngIf="status === 'idle'"
    mark="PA"
    title="No payment in progress"
    message="Waiting for a StartPayment intent from Customer Profile."
  >
    <button pButton type="button" label="New Payment" (click)="handleNew()"></button>
  </interop-empty-state>

  <div *ngIf="status === 'pending'" class="ws-content">
    <div class="ws-card">
      <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:16px">
        <div>
          <div style="font-size:16px;font-weight:850">New Payment Instruction</div>
          <div style="font-size:12px;color:var(--ws-muted);margin-top:2px">{{ form.reference }}</div>
        </div>
        <interop-status-badge label="Pending Review" severity="warn" />
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px">
        <label>
          <span class="ws-label">Customer</span>
          <input pInputText type="text" [(ngModel)]="form.customerName" [readOnly]="fromIntent" style="width:100%;margin-top:4px" />
        </label>
        <label>
          <span class="ws-label">Customer ID</span>
          <input pInputText type="text" [(ngModel)]="form.customerId" [readOnly]="fromIntent" style="width:100%;margin-top:4px" />
        </label>
        <label>
          <span class="ws-label">Amount</span>
          <input pInputText type="number" [(ngModel)]="form.amount" style="width:100%;margin-top:4px" />
        </label>
        <label>
          <span class="ws-label">Currency</span>
          <input pInputText type="text" [(ngModel)]="form.currency" style="width:100%;margin-top:4px" />
        </label>
        <label>
          <span class="ws-label">Recipient Name</span>
          <input pInputText type="text" [(ngModel)]="form.recipientName" style="width:100%;margin-top:4px" />
        </label>
        <label>
          <span class="ws-label">Recipient IBAN</span>
          <input pInputText type="text" [(ngModel)]="form.recipientIban" style="width:100%;margin-top:4px" />
        </label>
        <label style="grid-column:1 / -1">
          <span class="ws-label">Description</span>
          <input pInputText type="text" [(ngModel)]="form.description" style="width:100%;margin-top:4px" />
        </label>
      </div>

      <div class="ws-card" style="box-shadow:none;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
        <span style="color:var(--ws-muted);font-weight:800">Payment Total</span>
        <span style="font-size:22px;font-weight:900">{{ form.currency }} {{ paymentTotal | number:'1.2-2' }}</span>
      </div>

      <div style="display:flex;gap:10px">
        <button pButton type="button" label="Approve Payment" severity="success" style="flex:1" (click)="handleApprove()"></button>
        <button pButton type="button" label="Reject" severity="danger" [outlined]="true" (click)="handleReject()"></button>
      </div>
    </div>
  </div>
</div>
