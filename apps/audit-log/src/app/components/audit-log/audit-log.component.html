<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">AL</span>
      <span class="ws-title-text">Audit Log</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0">
      <span style="min-width:0;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ws-muted);font-size:12px;font-weight:800">
        {{ selectedFund ? (selectedFund.ticker + ' - ' + selectedFund.name) : 'All fund events' }}
      </span>
      <p-tag *ngIf="lastOrderId" [value]="'Last order ' + lastOrderId" severity="secondary"></p-tag>
      <p-tag [value]="events.length + ' events'" severity="warn"></p-tag>
    </div>
  </div>

  <div [class]="agGridTheme" class="ws-grid">
    <ag-grid-angular
      [rowData]="events"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [getRowId]="getRowId"
      style="width:100%;height:100%"
    ></ag-grid-angular>
  </div>
</div>
