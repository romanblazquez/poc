<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* ws://localhost:*; script-src 'self' 'unsafe-inline' http://localhost:*; style-src 'self' 'unsafe-inline';" />
    <title>FDC3 Desktop Shell</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        color-scheme: dark;
        --shell-bg: #0b1118;
        --shell-panel: #111a25;
        --shell-panel-2: #162231;
        --shell-panel-3: #1c2a3b;
        --shell-border: #2b3d52;
        --shell-border-soft: #203043;
        --shell-text: #ecf3fb;
        --shell-muted: #9aacbd;
        --shell-subtle: #6e8297;
        --shell-accent: #4f8cff;
        --shell-accent-soft: rgba(79, 140, 255, 0.18);
        --shell-accent-border: rgba(79, 140, 255, 0.42);
        --shell-accent-text: #dce9ff;
        --shell-positive: #2fb370;
        --shell-negative: #ef5f5f;
        --shell-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --shell-bg: #eef3f8;
        --shell-panel: #ffffff;
        --shell-panel-2: #f6f8fb;
        --shell-panel-3: #e9eef5;
        --shell-border: #cfd8e3;
        --shell-border-soft: #dde5ef;
        --shell-text: #162234;
        --shell-muted: #5d7085;
        --shell-subtle: #8191a3;
        --shell-accent: #1f6feb;
        --shell-accent-soft: rgba(31, 111, 235, 0.12);
        --shell-accent-border: rgba(31, 111, 235, 0.32);
        --shell-accent-text: #17365f;
        --shell-positive: #087443;
        --shell-negative: #b42318;
        --shell-shadow: 0 12px 28px rgba(37, 52, 72, 0.12);
      }
      body {
        background: var(--shell-bg);
        color: var(--shell-text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
