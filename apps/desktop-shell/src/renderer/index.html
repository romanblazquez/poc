<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* ws://localhost:*; script-src 'self' 'unsafe-inline' http://localhost:*; style-src 'self' 'unsafe-inline';" />
    <title>FDC3 Desktop Shell</title>
    <script>
      (() => {
        const key = 'fdc3.desktop.theme';
        const fallback = 'dark-financial';
        const stored = window.localStorage.getItem(key) || fallback;
        document.documentElement.dataset.theme = stored;
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--shell-bg);
        color: var(--shell-text);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
