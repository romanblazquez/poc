<!doctype html>
<html lang="en" data-theme="dark-financial">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose an app</title>
    <style>
      :root {
        --bg: #15182b;
        --panel: #1e2240;
        --panel-2: #262b4f;
        --text: #e6e9ff;
        --muted: #8d93b8;
        --accent: #4080e8;
        --accent-text: #ffffff;
        --border: rgba(255, 255, 255, 0.08);
        --danger: #e84040;
      }
      html[data-theme='light-financial'] {
        --bg: #f4f5fa;
        --panel: #ffffff;
        --panel-2: #f0f2f8;
        --text: #1a1d2e;
        --muted: #5b6280;
        --border: rgba(0, 0, 0, 0.08);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      .root {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        padding: 14px 18px 10px;
        border-bottom: 1px solid var(--border);
      }
      .intent {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .intent-name {
        font-size: 18px;
        font-weight: 600;
        margin-top: 2px;
      }
      .context-hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px;
      }
      .candidate {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        margin: 4px 0;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.08s ease, border-color 0.08s ease;
      }
      .candidate:hover, .candidate:focus-visible {
        background: var(--panel-2);
        border-color: var(--accent);
        outline: none;
      }
      .candidate:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
      .icon {
        font-size: 22px;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        background: var(--panel-2);
        border-radius: 8px;
        flex-shrink: 0;
      }
      .meta { flex: 1; min-width: 0; }
      .title { font-weight: 600; }
      .description {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 3px 7px;
        border-radius: 6px;
        background: rgba(64, 128, 232, 0.18);
        color: var(--accent);
        flex-shrink: 0;
      }
      .badge.open { background: rgba(141, 147, 184, 0.18); color: var(--muted); }
      footer {
        display: flex;
        justify-content: flex-end;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
      }
      button.cancel {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
      }
      button.cancel:hover { background: var(--panel-2); }
      .empty {
        padding: 30px;
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="root">
      <header>
        <div class="intent">Resolve intent</div>
        <div id="intent-name" class="intent-name">…</div>
        <div id="context-hint" class="context-hint"></div>
      </header>
      <div id="list" class="list" role="listbox" aria-label="Candidate apps">
        <div class="empty">Loading…</div>
      </div>
      <footer>
        <button class="cancel" id="cancel-btn" type="button">Cancel</button>
      </footer>
    </div>
    <script type="module" src="./intent-resolver.ts"></script>
  </body>
</html>
