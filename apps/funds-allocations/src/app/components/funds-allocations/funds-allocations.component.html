<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">FA</span>
      <span class="ws-title-text">Funds Allocations</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0;color:var(--ws-muted);font-size:12px;font-weight:800">
      <span style="min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        {{ selectedFund?.ticker ?? 'No fund' }}
      </span>
      <span>$4.41B AUM</span>
      <span class="positive">+2.7% drift</span>
    </div>
  </div>

  <div [class]="agGridTheme" class="ws-grid">
    <ag-grid-angular
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      rowSelection="single"
      [animateRows]="true"
      [getRowId]="getRowId"
      (rowClicked)="onRowClicked($event)"
      style="width:100%;height:100%"
    ></ag-grid-angular>
  </div>
</div>
