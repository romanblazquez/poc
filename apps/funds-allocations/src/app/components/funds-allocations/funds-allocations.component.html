<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">FA</span>
      <span class="ws-title-text">Funds Allocations</span>
    </div>
    <p-tag value="AG Grid" severity="info"></p-tag>
  </div>

  <div class="ws-toolbar">
    <div class="ws-kpis">
      <div>
        <div class="ws-kpi-label">Selected Fund</div>
        <div class="ws-kpi-value">{{ selectedFund?.ticker ?? 'None' }}</div>
      </div>
      <div>
        <div class="ws-kpi-label">Total AUM</div>
        <div class="ws-kpi-value">$4.41B</div>
      </div>
      <div>
        <div class="ws-kpi-label">Largest Drift</div>
        <div class="ws-kpi-value positive">+2.7%</div>
      </div>
    </div>
  </div>

  <div [class]="agGridTheme" class="ws-grid">
    <ag-grid-angular
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      rowSelection="single"
      [animateRows]="true"
      [getRowId]="getRowId"
      (rowClicked)="onRowClicked($event)"
      style="width:100%;height:100%"
    ></ag-grid-angular>
  </div>
</div>
