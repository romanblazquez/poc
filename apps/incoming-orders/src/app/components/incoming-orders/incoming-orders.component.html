<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">IO</span>
      <span class="ws-title-text">Incoming Orders</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0">
      <span style="min-width:0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ws-muted);font-size:12px;font-weight:800">
        {{ selectedFund ? selectedFund.name : 'All funds' }}
      </span>
      <button
        *ngIf="selectedFund"
        pButton
        type="button"
        size="small"
        label="Clear"
        severity="secondary"
        [outlined]="true"
        (click)="clearFilter()"
      ></button>
      <p-tag [value]="orders.length + ' orders'" severity="info"></p-tag>
    </div>
  </div>

  <div [class]="agGridTheme" class="ws-grid">
    <ag-grid-angular
      [rowData]="orders"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      rowSelection="single"
      [animateRows]="true"
      [getRowId]="getRowId"
      (rowClicked)="onRowClicked($event)"
      style="width:100%;height:100%"
    ></ag-grid-angular>
  </div>
</div>
