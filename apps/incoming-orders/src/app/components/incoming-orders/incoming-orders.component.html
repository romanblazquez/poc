<div class="workstation-app">
  <div class="ws-header">
    <div class="ws-title">
      <span class="ws-title-mark">IO</span>
      <span class="ws-title-text">Incoming Orders</span>
    </div>
    <p-tag [value]="orders.length + ' orders'" severity="info"></p-tag>
  </div>

  <div class="ws-toolbar">
    <div style="flex:1;min-width:0">
      <div class="ws-label">Fund Filter</div>
      <div class="ws-kpi-value">{{ selectedFund ? selectedFund.name : 'All funds' }}</div>
    </div>
    <button pButton type="button" label="Clear" severity="secondary" [outlined]="true" (click)="clearFilter()"></button>
  </div>

  <div [class]="agGridTheme" class="ws-grid">
    <ag-grid-angular
      [rowData]="orders"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      rowSelection="single"
      [animateRows]="true"
      [getRowId]="getRowId"
      (rowClicked)="onRowClicked($event)"
      style="width:100%;height:100%"
    ></ag-grid-angular>
  </div>
</div>
